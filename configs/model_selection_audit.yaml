schema_version: 1
as_of: "2026-09-16"

# Evidence states:
#   verified   measured inside this repository under a recorded protocol
#   documented stated by an official upstream source, but not measured here
#   failed     explicitly unsupported or failed the project gate
#   unknown    no adequate evidence; always fails closed
tracks:
  direct_s2s:
    purpose: Select a trainable native full-duplex Persian speech model for the direct branch.
    current_selection: moshika-7b
    controlled_same_panel_comparison: false
    requirements:
      native_full_duplex: {minimum: documented}
      public_inference: {minimum: documented}
      public_adaptation: {minimum: documented}
      public_license_or_terms: {minimum: documented}
      persian_speech_output: {minimum: verified}
      target_24gb_path: {minimum: documented}
    candidates:
      moshika-7b:
        notes: Reproducible engineering baseline; v1-v6.2 produced no eligible Persian runtime checkpoint.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/kyutai-labs/moshi
          public_inference:
            status: documented
            source: https://github.com/kyutai-labs/moshi
          public_adaptation:
            status: documented
            source: https://github.com/kyutai-labs/moshi-finetune
          public_license_or_terms:
            status: documented
            source: https://huggingface.co/kyutai/moshika-pytorch-bf16
            notes: Official weights publish CC-BY-4.0 terms; repository code and third-party components retain their own notices.
          persian_speech_output:
            status: failed
            source: local:results/moshi_v6_text_dropout_runtime.json
            notes: Every v6.2 checkpoint passed 0/9 frozen runtime rows.
          target_24gb_path:
            status: documented
            source: https://github.com/kyutai-labs/moshi
      personaplex-7b-v1:
        notes: Strong full-duplex behavior, but the official release is English input/output.
        evidence:
          native_full_duplex:
            status: documented
            source: https://huggingface.co/nvidia/personaplex-7b-v1
          public_inference:
            status: documented
            source: https://github.com/NVIDIA/personaplex
          public_adaptation:
            status: unknown
            source: https://github.com/NVIDIA/personaplex
          public_license_or_terms:
            status: documented
            source: https://huggingface.co/nvidia/personaplex-7b-v1
          persian_speech_output:
            status: failed
            source: https://huggingface.co/nvidia/personaplex-7b-v1
            notes: Official use case is English speech input and English speech response.
          target_24gb_path:
            status: unknown
            source: https://huggingface.co/nvidia/personaplex-7b-v1
      qwen3-omni-30b-a3b:
        notes: Strong streaming omni model, but not a verified native-duplex Persian 24 GB adaptation path.
        evidence:
          native_full_duplex:
            status: unknown
            source: https://github.com/QwenLM/Qwen3-Omni
          public_inference:
            status: documented
            source: https://github.com/QwenLM/Qwen3-Omni
          public_adaptation:
            status: unknown
            source: https://github.com/QwenLM/Qwen3-Omni
          public_license_or_terms:
            status: documented
            source: https://github.com/QwenLM/Qwen3-Omni
          persian_speech_output:
            status: failed
            source: https://github.com/QwenLM/Qwen3-Omni
            notes: Official speech-output languages are English, Chinese, French, German, Russian, Italian, Spanish, Portuguese, Japanese, and Korean; Persian is excluded.
          target_24gb_path:
            status: unknown
            source: https://github.com/QwenLM/Qwen3-Omni
      minicpm-o-4.5:
        notes: Current full-duplex candidate; Persian behavior and adaptation remain unverified.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/OpenBMB/MiniCPM-V
          public_inference:
            status: documented
            source: https://github.com/OpenBMB/MiniCPM-V
          public_adaptation:
            status: documented
            source: https://github.com/OpenBMB/MiniCPM-V
            notes: Official documentation lists LLaMA-Factory and SWIFT training support, but does not establish Persian or full-duplex audio-token adaptation.
          public_license_or_terms:
            status: documented
            source: https://github.com/OpenBMB/MiniCPM-V
          persian_speech_output:
            status: unknown
            source: https://github.com/OpenBMB/MiniCPM-V
          target_24gb_path:
            status: documented
            source: https://github.com/OpenBMB/MiniCPM-V
            notes: Quantized llama.cpp path is documented; standard PyTorch path requests 28 GB.
      covo-audio-chat-fd:
        notes: The paper describes an FD variant, while the public checkpoint is the English/Chinese Chat model.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/Tencent/Covo-Audio
          public_inference:
            status: unknown
            source: https://huggingface.co/tencent/Covo-Audio-Chat
            notes: The public checkpoint is Chat, not the described full-duplex variant.
          public_adaptation:
            status: unknown
            source: https://github.com/Tencent/Covo-Audio
          public_license_or_terms:
            status: documented
            source: https://github.com/Tencent/Covo-Audio
          persian_speech_output:
            status: unknown
            source: https://huggingface.co/tencent/Covo-Audio-Chat
          target_24gb_path:
            status: unknown
            source: https://github.com/Tencent/Covo-Audio
      bayling-duplex:
        notes: Native-duplex inference release; Persian adaptation and target fit are unverified.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/BayLing-Models/BayLing-Duplex
          public_inference:
            status: documented
            source: https://github.com/BayLing-Models/BayLing-Duplex
          public_adaptation:
            status: unknown
            source: https://github.com/BayLing-Models/BayLing-Duplex
          public_license_or_terms:
            status: documented
            source: https://github.com/BayLing-Models/BayLing-Duplex
          persian_speech_output:
            status: unknown
            source: https://github.com/BayLing-Models/BayLing-Duplex
          target_24gb_path:
            status: unknown
            source: https://github.com/BayLing-Models/BayLing-Duplex
      duplexomni:
        notes: Public research pipeline with very large external assets; no verified Persian/24 GB result.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/MuyeHuang/DuplexOmni
          public_inference:
            status: documented
            source: https://github.com/MuyeHuang/DuplexOmni
          public_adaptation:
            status: documented
            source: https://github.com/MuyeHuang/DuplexOmni
          public_license_or_terms:
            status: documented
            source: https://github.com/MuyeHuang/DuplexOmni
          persian_speech_output:
            status: unknown
            source: https://github.com/MuyeHuang/DuplexOmni
          target_24gb_path:
            status: unknown
            source: https://github.com/MuyeHuang/DuplexOmni
      lychee-fd:
        notes: Native full-duplex 13B BF16 release with public domain-adaptation code; official evidence covers Chinese/English, not Persian, and the base weights alone exceed the 24 GB target before the separate Token2Wav runtime.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/HITsz-TMG/Lychee-FD
          public_inference:
            status: documented
            source: https://github.com/HITsz-TMG/Lychee-FD
          public_adaptation:
            status: documented
            source: https://github.com/HITsz-TMG/Lychee-FD/tree/main/Training_package
            notes: Official training package supports supervised text, speech-token, control-token, and backchannel training.
          public_license_or_terms:
            status: documented
            source: https://github.com/HITsz-TMG/Lychee-FD
            notes: Official code and model card identify Apache-2.0; Token2Wav remains subject to its upstream terms.
          persian_speech_output:
            status: unknown
            source: https://huggingface.co/HIT-TMG/Lychee-FD
            notes: The official model card tags Chinese and English and provides no Persian output evidence.
          target_24gb_path:
            status: failed
            source: https://huggingface.co/HIT-TMG/Lychee-FD
            notes: The official checkpoint is 13B BF16, already more than 24 GB in raw weight bytes; inference additionally requires Token2Wav, KV cache, and runtime allocations.
      nvidia-nemotronlabs-voicechat-11b:
        notes: Native full-duplex English model with public inference, but no official adaptation recipe or Persian output and a 44.4 GB checkpoint outside the 24 GB target.
        evidence:
          native_full_duplex:
            status: documented
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B
          public_inference:
            status: documented
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B
          public_adaptation:
            status: unknown
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B
          public_license_or_terms:
            status: documented
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B
            notes: Official weights are governed by OpenMDW-1.1, not this repository's Apache-2.0 license.
          persian_speech_output:
            status: failed
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B
            notes: The official model card declares English and its speech encoder is Nemotron-Speech-Streaming-En-0.6b; no Persian capability is documented.
          target_24gb_path:
            status: failed
            source: https://huggingface.co/nvidia/NVIDIA-NemotronLabs-VoiceChat-11B/tree/main
            notes: The official repository is 44.4 GB and supported hardware lists data-center GPUs and RTX 6000, not a 24 GB path.
      realtime-venus-audio-9b:
        notes: Four-day-old native full-duplex research result; no public checkpoint, inference implementation, adaptation code, Persian evidence, or 24 GB path was found in official sources.
        evidence:
          native_full_duplex:
            status: documented
            source: https://arxiv.org/abs/2609.13814
          public_inference:
            status: unknown
            source: https://arxiv.org/abs/2609.13814
          public_adaptation:
            status: unknown
            source: https://arxiv.org/abs/2609.13814
          public_license_or_terms:
            status: unknown
            source: https://arxiv.org/abs/2609.13814
          persian_speech_output:
            status: unknown
            source: https://arxiv.org/abs/2609.13814
          target_24gb_path:
            status: unknown
            source: https://arxiv.org/abs/2609.13814
      duplexsla:
        notes: Native full-duplex research proposal whose official repository explicitly says inference code, deployment recipes, and checkpoints are not yet released.
        evidence:
          native_full_duplex:
            status: documented
            source: https://github.com/hyzhang24/DuplexSLA
          public_inference:
            status: failed
            source: https://github.com/hyzhang24/DuplexSLA
            notes: Official repository states that inference code and checkpoints are not yet released.
          public_adaptation:
            status: unknown
            source: https://github.com/hyzhang24/DuplexSLA
          public_license_or_terms:
            status: documented
            source: https://github.com/hyzhang24/DuplexSLA
            notes: Repository declares the MIT license, but unreleased weights may have separate future terms.
          persian_speech_output:
            status: unknown
            source: https://github.com/hyzhang24/DuplexSLA
          target_24gb_path:
            status: unknown
            source: https://github.com/hyzhang24/DuplexSLA

  asr:
    purpose: Select the Persian streaming ASR component on project data.
    current_selection: nemo-persian-finetune
    controlled_same_panel_comparison: true
    requirements:
      persian_support: {minimum: documented}
      streaming_or_service_runtime: {minimum: documented}
      project_persian_evaluation: {minimum: verified}
    candidates:
      nemo-persian-finetune:
        notes: Existing service retained by the leakage-conscious controlled development comparison.
        evidence:
          persian_support:
            status: verified
            source: local:results/eval/cascade_intelligibility_proxy.json
          streaming_or_service_runtime:
            status: verified
            source: local:results/eval/cascade_real_service_validation_panel.json
          project_persian_evaluation:
            status: verified
            source: local:results/eval/cascade_intelligibility_proxy.json
