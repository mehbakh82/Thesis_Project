# Latency contract for the thesis. Official numbers MUST be collected on a
# 12–24 GB GPU. Training may use the H100.

sample_rate: 16000

t_first_audio:
  definition: >
    Wall time from user end-of-speech (or accepted barge-in) to the first
    audible PCM sample of the assistant reply.
  gate_p50_ms: 500
  report_p95: true

t_barge_in:
  definition: >
    Wall time from the acoustic onset of a user interrupt to the moment
    assistant playback actually stops.
  gate_p95_ms: 300

eval_gpu:
  official_vram_gb_min: 12
  official_vram_gb_max: 24
  train_gpu: H100_NVL
  memory_cap_gb: 24

bargein_accuracy:
  target: 0.80
  metric: interrupt_vs_other_accuracy
  also_report: [interrupt_f1, far, frr]
