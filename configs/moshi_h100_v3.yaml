# Embedding-preserving controlled follow-up after Moshi v2 failed every
# complete-prompt official-runtime eligibility gate.
data:
  train_data: data/processed/moshi_finetune_v2/train.jsonl
  eval_data: data/processed/moshi_finetune_v2/val.jsonl
  shuffle: true

moshi_paths:
  hf_repo_id: kyutai/moshika-pytorch-bf16
  moshi_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/model.safetensors
  mimi_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/tokenizer-e351c8d8-checkpoint125.safetensors
  tokenizer_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/tokenizer_spm_32k_3.model
  config_path: configs/moshika_7b_legacy.json

full_finetuning: false
lora:
  enable: true
  rank: 128
  scaling: 2.0
  ft_embed: false

first_codebook_weight_multiplier: 100.0
text_padding_weight: 0.5

duration_sec: 100
batch_size: 1
num_microbatches: 4
max_steps: 500
gradient_checkpointing: true
optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05

seed: 20260827
log_freq: 10
eval_freq: 100
do_eval: true
do_ckpt: true
ckpt_freq: 100
num_ckpt_keep: 5
save_adapters: true
run_dir: checkpoints/moshi_fa_100s_v3_no_embed
overwrite_run_dir: false
