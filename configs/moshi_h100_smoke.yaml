# One-step infrastructure validation only; never report this as model training evidence.
data:
  train_data: data/processed/moshi_smoke/train.jsonl
  eval_data: ""
  shuffle: false

moshi_paths:
  hf_repo_id: kyutai/moshika-pytorch-bf16
  moshi_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/model.safetensors
  mimi_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/tokenizer-e351c8d8-checkpoint125.safetensors
  tokenizer_path: hf_cache/pinned/moshika-pytorch-bf16-a49141e/tokenizer_spm_32k_3.model
  config_path: configs/moshika_7b_legacy.json

full_finetuning: false
lora:
  enable: true
  rank: 8
  scaling: 2.0
  ft_embed: false

first_codebook_weight_multiplier: 100.0
text_padding_weight: 0.5
duration_sec: 5
batch_size: 1
num_microbatches: 1
max_steps: 1
gradient_checkpointing: true
optim:
  lr: 2.0e-6
  weight_decay: 0.1
  pct_start: 0.05
seed: 20260823
log_freq: 1
eval_freq: 0
do_eval: false
do_ckpt: false
ckpt_freq: 0
save_adapters: true
run_dir: checkpoints/moshi_smoke
# Safe because this run directory contains no scientific result.
overwrite_run_dir: true
