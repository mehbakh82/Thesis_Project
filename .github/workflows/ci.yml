name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          # Validate the strictest supported interpreter boundary. Newer
          # interpreters are exercised by local development and training.
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy --no-incremental src/thesis_s2s
      - name: Tracked artifact, history, privacy, and secret audit
        run: python scripts/ci_artifact_audit.py
      - name: Frozen evaluator source and receipt audit
        run: python scripts/verify_frozen_evaluator_sources.py
      - name: Application dependency vulnerability and risk-drift audit
        run: python scripts/audit_application_dependencies.py --out results/security/application_dependency_audit.json
      - name: Test
        run: coverage run -m pytest -q
      - name: Coverage
        run: coverage report --fail-under=60
      - name: Set up Python 3.12 for the scientific-lock audit
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install scientific dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Pinned Moshi dependency risk drift audit
        run: python scripts/audit_moshi_dependencies.py
