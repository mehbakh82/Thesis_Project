name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Types
        run: mypy --no-incremental src/thesis_s2s
      - name: Tracked artifact, history, privacy, and secret audit
        run: python scripts/ci_artifact_audit.py
      - name: Dependency vulnerability audit
        run: pip-audit --requirement requirements.txt --strict
      - name: Test
        run: coverage run -m pytest -q
      - name: Coverage
        run: coverage report --fail-under=55
