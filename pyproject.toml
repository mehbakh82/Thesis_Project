[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-s2s"
version = "0.1.0"
description = "Persian full-duplex speech-to-speech thesis prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mehran Bakhtiari" }]
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "transformers>=4.40",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "websockets>=12",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12", "piper-tts>=1.3"]
train = ["peft>=0.11", "accelerate>=0.30"]
dev = [
  "pytest>=8.0",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "ruff>=0.6",
  "pip-audit>=2.7",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
thesis-s2s = "thesis_s2s.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["thesis_s2s"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
]

[[tool.mypy.overrides]]
module = [
  "thesis_s2s.bakeoff.*",
  "thesis_s2s.data.batch_reasr",
  "thesis_s2s.data.ingest",
]
ignore_errors = true

# NumPy can ship interpreter-specific syntax in the stubs selected for the
# current runtime. Skipping third-party implementation stubs keeps mypy focused
# on this project while preserving the declared Python 3.10 target.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
