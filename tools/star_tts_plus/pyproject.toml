[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "star-tts-plus"
version = "1.0.0"
description = "Measured inference improvements for the lab Persian VITS (star.text_to_speech) without retraining"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "librosa", "resampy"]

[tool.setuptools.packages.find]
include = ["star_tts_plus*"]
